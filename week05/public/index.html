<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hangman</title>

  <!-- Confetti Script -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- TOP BAR -->
  <div class="top-bar">

    <!-- LEFT -->
    <a href="/words.html" class="menu-link">Quit</a>

    <!-- CENTERED TITLE -->
    <h1>HANGMAN</h1>

    <!-- RIGHT LINKS -->
    <div>
      <a href="#" class="menu-link">Help</a>
      <a href="#" class="menu-link">About</a>
    </div>

  </div>

  <!-- GAME LAYOUT -->
  <div class="game-container">

    <!-- LEFT SIDE -->
    <div class="left-panel">

      <p class="lives">
        Lives remaining <span id="errors">0</span>
      </p>

      <p id="hiddenWord" class="hiddenWord"></p>

      <p class="hint">Enter a letter you think is in the word.</p>

      <div id="letters" class="letters-grid"></div>

      <p id="message" class="message"></p>

      <button id="playAgainBtn" class="play-btn" style="display:none;">
        Play Again
      </button>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right-panel">
      <img src="images/hangman.png" class="hangman-img">
    </div>

  </div>

  <script src="js/game.js"></script>
</body>
</html>
